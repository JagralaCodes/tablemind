name: app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  bounce: ^1.0.2
  image_picker: ^1.2.3
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Antic
      fonts:
        - asset: assets/fonts/AnticSlab.ttf
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa.ttf
    - family: Dongle
      fonts:
        - asset: assets/fonts/Dongle-Regular.ttf
          weight: 500
        - asset: assets/fonts/Dongle-Bold.ttf
          weight: 700
        - asset: assets/fonts/Dongle-Light.ttf
          weight: 300
